<div class="auth-container">

  <h1>TaskFlow</h1>

  <h2>Login</h2>

  <form (ngSubmit)="login()">

    <label>Email</label>

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Enter your email"
      required
    />

    <label>Password</label>

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Enter your password"
      required
    />

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button
      type="submit"
      [disabled]="loading"
    >
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>

  </form>

  <p>
    Don't have an account?
    <a routerLink="/register">Register</a>
  </p>

</div>
