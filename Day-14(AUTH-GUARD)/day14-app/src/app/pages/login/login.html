<div class="login-page">

  <div class="login-card">

    <h1>TaskFlow</h1>

    <h2>Login</h2>

    <p class="subtitle">
      Sign in to access your task board
    </p>

    <form (ngSubmit)="login()">

      <label for="username">
        Username
      </label>

      <input
        id="username"
        type="text"
        name="username"
        [(ngModel)]="username"
        placeholder="Enter username"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Enter password"
        required
      >

      @if (errorMessage) {
        <p class="error">
          {{ errorMessage }}
        </p>
      }

      <button type="submit">
        Login
      </button>

    </form>

    <div class="demo">
      <strong>Demo Login</strong>
      <span>Username: admin</span>
      <span>Password: 1234</span>
    </div>

  </div>

</div>
