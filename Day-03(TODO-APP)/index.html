<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>📝 Todo App</h1>

    <div class="input-section">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter a new task..."
        >

        <button id="addBtn">
            Add Task
        </button>
    </div>

    <div class="stats">

        <div class="card">
            <h3>Total</h3>
            <p id="totalTasks">0</p>
        </div>

        <div class="card">
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
        </div>

        <div class="card">
            <h3>Pending</h3>
            <p id="pendingTasks">0</p>
        </div>

    </div>

    <div class="progress-container">

        <div class="progress-text">
            Progress :
            <span id="progressPercent">0%</span>
        </div>

        <div class="progress-bar">

            <div
                id="progressFill"
                class="progress-fill">
            </div>

        </div>

    </div>

    <ul id="taskList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
