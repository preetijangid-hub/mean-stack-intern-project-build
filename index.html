<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FizzBuzz Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>FizzBuzz Checker</h1>

    <p>Enter a number to check the FizzBuzz result.</p>

    <input
        type="number"
        id="numberInput"
        placeholder="Enter Number"
    >

    <button onclick="checkFizzBuzz()">
        Check
    </button>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
