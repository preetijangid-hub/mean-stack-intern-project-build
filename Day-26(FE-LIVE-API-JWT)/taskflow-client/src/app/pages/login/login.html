<div class="auth-page">

  <div class="auth-card">

    <div class="brand">
      <h1>TaskFlow</h1>
      <p>Manage your tasks with ease</p>
    </div>


    <h2>Welcome Back</h2>

    <p class="subtitle">
      Login to your account
    </p>


    <form
      #loginForm="ngForm"
      (ngSubmit)="login()"
      novalidate
    >


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />

      </div>


      @if (errorMessage) {

        <div class="error-message">
          {{ errorMessage }}
        </div>

      }


      <button
        type="submit"
        [disabled]="loading"
      >

        {{
          loading
            ? 'Logging in...'
            : 'Login'
        }}

      </button>


    </form>


    <p class="register-link">

      Don't have an account?

      <a routerLink="/register">
        Create an account
      </a>

    </p>


  </div>

</div>
