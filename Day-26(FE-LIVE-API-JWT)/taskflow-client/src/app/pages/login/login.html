<div class="auth-page">

  <div class="auth-card">

    <div class="brand">
      <h1>TaskFlow</h1>
      <p>Login to your account</p>
    </div>

    <form (ngSubmit)="login()">

      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
        />
      </div>

      <div class="form-group">
        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
        />
      </div>

      <div
        class="error"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <p class="switch">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>

  </div>

</div>
