<div class="auth-page">

  <div class="auth-card">

    <div class="brand">

      <h1>TaskFlow</h1>

      <p>
        Create your TaskFlow account
      </p>

    </div>


    <h2>Create Account</h2>

    <p class="subtitle">
      Register to start managing your tasks
    </p>


    <form
      #registerForm="ngForm"
      (ngSubmit)="register()"
      novalidate
    >


      <div class="form-group">

        <label for="name">
          Name
        </label>

        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your name"
          required
        />

      </div>


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />

      </div>


      @if (errorMessage) {

        <div class="error-message">
          {{ errorMessage }}
        </div>

      }


      <button
        type="submit"
        [disabled]="loading"
      >

        {{
          loading
            ? 'Creating account...'
            : 'Create Account'
        }}

      </button>


    </form>


    <p class="login-link">

      Already have an account?

      <a routerLink="/login">
        Login
      </a>

    </p>


  </div>

</div>
