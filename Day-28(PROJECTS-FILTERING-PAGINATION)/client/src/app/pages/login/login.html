<main class="auth">
  <section class="card">
    <h1>TaskFlow</h1>
    <h2>Login</h2>

    @if (error) {
      <div class="error">{{ error }}</div>
    }

    <form #f="ngForm" (ngSubmit)="submit(f)">
      <label>Email</label>
      <input name="email" type="email" [(ngModel)]="email" required email />

      <label>Password</label>
      <input
        name="password"
        type="password"
        [(ngModel)]="password"
        required
        minlength="6"
      />

      <button [disabled]="loading">
        {{ loading ? "Logging in..." : "Login" }}
      </button>
    </form>

    <p>New user? <a routerLink="/register">Register</a></p>
  </section>
</main>
